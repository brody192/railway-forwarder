[workspace]
members = ["apps/railway-forwarder", "crates/ssh-forward", "crates/macos-status-menu"]
default-members = ["apps/railway-forwarder"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
serde = "1"
tokio = "1"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0

[profile.release]
debug = 0
strip = "symbols"
