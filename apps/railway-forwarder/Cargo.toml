[package]
name = "railway-forwarder"
version.workspace = true
edition.workspace = true

[[bin]]
name = "RailwayForwarder"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.8.1"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
async-channel = "2"
graphql_client = "=0.14.0"
futures-util = "0.3"
anyhow.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
uuid.workspace = true
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
libc.workspace = true
unicode-segmentation = "1"
unicode-properties = "0.1"
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true
objc2-authentication-services = "0.3"
block2 = "0.6"
ssh-forward = { path = "../../crates/ssh-forward", features = ["serde"] }
macos-status-menu = { path = "../../crates/macos-status-menu" }
