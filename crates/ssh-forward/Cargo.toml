[package]
name = "ssh-forward"
version.workspace = true
edition.workspace = true
description = "In-process SSH port forwarding and Linux TCP listener discovery"
readme = "README.md"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
anyhow.workspace = true
libc.workspace = true
rand-ssh = { package = "rand", version = "0.10" }
russh = { version = "=0.60.3", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "=2.2.2"
serde = { workspace = true, features = ["derive"], optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
uuid.workspace = true
